<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 760" width="412" height="760" role="img" aria-label="طالب يدرس ليلًا على مكتبه">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#123033"/>
      <stop offset=".55" stop-color="#0D2325"/>
      <stop offset="1"   stop-color="#081617"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0"  stop-color="#DFA155" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#DFA155" stop-opacity=".14"/>
      <stop offset="1"  stop-color="#DFA155" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FB4B7"/>
      <stop offset="1" stop-color="#2F6F73"/>
    </linearGradient>
  </defs>

  <rect width="412" height="760" fill="url(#sky)"/>

  <!-- نجوم -->
  <g fill="#9FD3D5">
    <circle cx="52"  cy="78"  r="1.6" opacity=".8"/>
    <circle cx="118" cy="46"  r="1.1" opacity=".5"/>
    <circle cx="196" cy="96"  r="1.8" opacity=".65"/>
    <circle cx="286" cy="58"  r="1.2" opacity=".45"/>
    <circle cx="352" cy="118" r="1.5" opacity=".7"/>
    <circle cx="88"  cy="168" r="1.1" opacity=".4"/>
    <circle cx="330" cy="212" r="1.3" opacity=".35"/>
  </g>

  <!-- نافذة -->
  <g opacity=".5">
    <rect x="228" y="92" width="150" height="180" rx="10" fill="#0A1C1E" stroke="#2A4A4C" stroke-width="2"/>
    <line x1="303" y1="92" x2="303" y2="272" stroke="#2A4A4C" stroke-width="2"/>
    <line x1="228" y1="182" x2="378" y2="182" stroke="#2A4A4C" stroke-width="2"/>
    <circle cx="345" cy="130" r="20" fill="#EBF4F4" opacity=".22"/>
  </g>

  <!-- أفق المدينة -->
  <g fill="#0A1D1F" opacity=".9">
    <rect x="0"   y="300" width="46" height="120"/>
    <rect x="52"  y="336" width="34" height="84"/>
    <rect x="92"  y="286" width="40" height="134"/>
    <rect x="140" y="330" width="28" height="90"/>
    <rect x="352" y="318" width="60" height="102"/>
  </g>
  <g fill="#DFA155" opacity=".5">
    <rect x="10" y="316" width="7" height="9"/><rect x="26" y="340" width="7" height="9"/>
    <rect x="100" y="302" width="7" height="9"/><rect x="116" y="330" width="7" height="9"/>
    <rect x="366" y="336" width="7" height="9"/>
  </g>

  <!-- توهّج المصباح -->
  <ellipse cx="118" cy="470" rx="190" ry="150" fill="url(#lamp)"/>

  <!-- المكتب -->
  <rect x="0" y="556" width="412" height="204" fill="#10292B"/>
  <rect x="0" y="552" width="412" height="10" rx="4" fill="#17383A"/>

  <!-- مصباح -->
  <g stroke="#2F6F73" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M62 552 V470"/>
    <path d="M62 470 q0 -38 42 -38"/>
  </g>
  <path d="M92 420 h48 l14 34 h-76 z" fill="#DFA155"/>
  <ellipse cx="116" cy="454" rx="38" ry="7" fill="#F2CE96" opacity=".5"/>

  <!-- كتب مكدّسة -->
  <g>
    <rect x="292" y="524" width="94" height="12" rx="3" fill="#2F6F73"/>
    <rect x="286" y="536" width="106" height="12" rx="3" fill="#B67F35"/>
    <rect x="298" y="548" width="88" height="9" rx="3" fill="#3D6E70"/>
  </g>

  <!-- دفتر مفتوح -->
  <g transform="translate(150 486)">
    <path d="M0 60 L8 6 q46 -12 88 0 q42 -12 88 0 L192 60 q-46 -10 -88 0 q-42 -10 -88 0 z" fill="#E7EFEE"/>
    <path d="M96 6 v54" stroke="#BFC9C9" stroke-width="2"/>
    <g stroke="#8B9797" stroke-width="2.5" stroke-linecap="round" opacity=".7">
      <path d="M22 24 h56"/><path d="M22 36 h44"/>
      <path d="M114 24 h56"/><path d="M114 36 h40"/>
    </g>
  </g>

  <!-- الهاتف -->
  <g transform="translate(56 438)">
    <rect x="0" y="0" width="72" height="122" rx="12" fill="#0B1B1C" stroke="#3D4E4D" stroke-width="2"/>
    <rect x="6" y="8" width="60" height="106" rx="7" fill="url(#screen)" opacity=".92"/>
    <g fill="#08201F" opacity=".5">
      <rect x="14" y="20" width="30" height="5" rx="2.5"/>
      <rect x="14" y="34" width="44" height="4" rx="2"/>
      <rect x="14" y="44" width="38" height="4" rx="2"/>
      <rect x="14" y="62" width="44" height="14" rx="4"/>
      <rect x="14" y="82" width="44" height="14" rx="4"/>
    </g>
  </g>

  <!-- الطالب: ظل بسيط -->
  <g fill="#071415">
    <circle cx="238" cy="452" r="40"/>
    <path d="M162 616 q0 -96 76 -96 q76 0 76 96 z"/>
  </g>
  <g fill="#0E2426">
    <circle cx="238" cy="452" r="34"/>
    <path d="M170 610 q0 -84 68 -84 q68 0 68 84 z"/>
  </g>
</svg>
