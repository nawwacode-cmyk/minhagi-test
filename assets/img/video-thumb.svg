<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="معاينة فيديو الدرس">
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#143234"/>
      <stop offset=".5"  stop-color="#1D484B"/>
      <stop offset="1"   stop-color="#2F6F73"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#7FB4B7" stroke-width="1" opacity=".13"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#vg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <circle cx="548" cy="66"  r="96" fill="#FFFFFF" opacity=".05"/>
  <circle cx="70"  cy="318" r="72" fill="#000000" opacity=".12"/>

  <!-- سبورة -->
  <g transform="translate(90 78)">
    <rect x="0" y="0" width="300" height="176" rx="10" fill="#0D2224" stroke="#3E7A7D" stroke-width="2.5"/>
    <g stroke="#9FD3D5" stroke-width="4" stroke-linecap="round" opacity=".85">
      <path d="M28 44 h84"/>
      <path d="M28 74 h150"/>
      <path d="M28 104 h116"/>
    </g>
    <g stroke="#DFA155" stroke-width="4" stroke-linecap="round" opacity=".9">
      <path d="M28 134 h60"/>
    </g>
    <circle cx="252" cy="46" r="14" fill="#DFA155" opacity=".5"/>
  </g>

  <!-- معلّم مبسّط -->
  <g transform="translate(430 132)">
    <circle cx="40" cy="34" r="30" fill="#0B1E1F"/>
    <circle cx="40" cy="34" r="25" fill="#17383A"/>
    <path d="M-6 168 q0 -72 46 -72 q46 0 46 72 z" fill="#0B1E1F"/>
    <path d="M0 166 q0 -62 40 -62 q40 0 40 62 z" fill="#1D484B"/>
  </g>
</svg>
