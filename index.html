<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#047B86">
  <title>منهاجي — منهاجك السوري بين يديك</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">

  <!-- الخط محلي داخل التطبيق ولا يُحمَّل من الشبكة: الطالب قد يفتحه أول مرة
       بلا إنترنت.

       Alexandria بأوزان ثابتة — ثلاثة ملفات للأوزان التي نستعملها فقط
       (٤٠٠ للنص · ٦٠٠ للعناوين الفرعية · ٧٠٠ للعناوين). لا نحمّل بقية الأوزان
       التسعة لأن كل ملف غير مستعمل هو تأخير في أول فتح.

       الوزنان ٤٠٠ و٧٠٠ بصيغة woff2 (٣٠ ك.ب لكل منهما بدل ١٠٠)، والوزن ٦٠٠
       ttf لأن الحزمة لا توفّر له woff2. تحويله يوفّر ٧٠ ك.ب إضافية. -->
  <style>
    @font-face { font-family:'Alexandria'; font-weight:400; font-style:normal; font-display:swap;
                 src: url('assets/fonts/Alexandria-400.woff2') format('woff2'); }
    @font-face { font-family:'Alexandria'; font-weight:600; font-style:normal; font-display:swap;
                 src: url('assets/fonts/Alexandria-600.ttf') format('truetype'); }
    @font-face { font-family:'Alexandria'; font-weight:700; font-style:normal; font-display:swap;
                 src: url('assets/fonts/Alexandria-700.woff2') format('woff2'); }
  </style>
